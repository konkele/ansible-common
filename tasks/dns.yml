---
- name: Ensure systemd-resolved drop-in directory exists
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure global DNS search domains
  copy:
    dest: /etc/systemd/resolved.conf.d/10-search-domains.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Resolve]
      Domains={{ common_dns_search | join(' ') }}
  when: common_dns_search | length > 0
  notify: Restart systemd-resolved
